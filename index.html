<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>King Bullet — FPS Target Range</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --hud-bg: rgba(10, 10, 18, 0.55);
      --hud-border: rgba(120, 200, 255, 0.25);
      --accent: #00e5ff;
      --accent-hot: #ff3d5a;
      --accent-gold: #ffd740;
      --text: #e8edf5;
      --font-ui: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: var(--font-ui);
      color: var(--text);
    }

    #game-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
    }

    /* ── Start Screen ───────────────────────────── */
    #start-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(0,229,255,0.08) 0%, transparent 60%),
                  linear-gradient(180deg, #0a0a12 0%, #12121f 100%);
      z-index: 100;
      gap: 28px;
      cursor: default;
      transition: opacity 0.5s ease;
    }
    #start-screen.hidden { opacity: 0; pointer-events: none; }

    #start-screen h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c4dff 50%, var(--accent-hot) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titlePulse 3s ease-in-out infinite alternate;
    }
    @keyframes titlePulse {
      0%   { filter: brightness(1); }
      100% { filter: brightness(1.3); }
    }

    #start-screen p {
      font-size: 1.05rem;
      color: rgba(232,237,245,0.6);
      max-width: 420px;
      text-align: center;
      line-height: 1.6;
    }

    .controls-hint {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 32px;
      margin-top: 8px;
    }
    .controls-hint span {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: rgba(232,237,245,0.45);
    }
    .controls-hint span b {
      color: var(--accent);
      font-weight: 700;
    }

    #start-btn {
      margin-top: 12px;
      padding: 16px 52px;
      font-family: var(--font-ui);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #0a0a12;
      background: linear-gradient(135deg, var(--accent), #7c4dff);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 4px 30px rgba(0,229,255,0.3);
    }
    #start-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 40px rgba(0,229,255,0.5);
    }

    /* ── HUD ─────────────────────────────────────── */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #hud.visible { opacity: 1; }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 28px; height: 28px;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.85);
      border-radius: 1px;
    }
    #crosshair::before {
      width: 2px; height: 100%;
      left: 50%; transform: translateX(-50%);
    }
    #crosshair::after {
      height: 2px; width: 100%;
      top: 50%; transform: translateY(-50%);
    }
    .crosshair-dot {
      position: absolute;
      width: 4px; height: 4px;
      background: var(--accent);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px var(--accent);
    }

    /* Hit marker */
    #hitmarker {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
      opacity: 0;
      transition: opacity 0.05s;
    }
    #hitmarker.flash { opacity: 1; }

    /* Top bar */
    #top-bar {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 32px;
      padding: 10px 28px;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
    }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(232,237,245,0.45);
    }
    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
    }
    #score-val  { color: var(--accent-gold); }
    #kills-val  { color: var(--accent-hot); }
    #timer-val  { color: var(--accent); }

    /* Bottom bar */
    #bottom-bar {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 40px; align-items: flex-end;
    }
    .bottom-panel {
      padding: 12px 24px;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      display: flex; align-items: center; gap: 14px;
    }
    #health-bar-outer {
      width: 160px; height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    #health-bar-inner {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #00e676, #69f0ae);
      border-radius: 4px;
      transition: width 0.3s;
    }
    #health-label { font-family: var(--font-mono); font-size: 0.85rem; }

    #ammo-display { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; }
    #ammo-current { color: var(--text); }
    #ammo-sep { color: rgba(232,237,245,0.3); margin: 0 4px; }
    #ammo-reserve { color: rgba(232,237,245,0.4); font-size: 1rem; }
    #ammo-display.reloading #ammo-current { color: var(--accent-hot); animation: reloadBlink 0.4s infinite alternate; }
    @keyframes reloadBlink { 0% { opacity: 1; } 100% { opacity: 0.3; } }
    #reload-hint {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(232,237,245,0.35);
    }

    /* Muzzle flash */
    #muzzle-flash {
      position: absolute;
      bottom: 80px; left: 50%;
      transform: translateX(-50%);
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(255,200,50,0.9) 0%, rgba(255,100,20,0.5) 40%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      filter: blur(4px);
    }
    #muzzle-flash.flash { animation: muzzle 0.08s ease-out forwards; }
    @keyframes muzzle {
      0%   { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.5); }
    }

    /* Kill feed */
    #kill-feed {
      position: absolute;
      top: 80px; right: 24px;
      display: flex; flex-direction: column;
      gap: 6px;
    }
    .kill-entry {
      padding: 6px 14px;
      background: var(--hud-bg);
      backdrop-filter: blur(8px);
      border-left: 3px solid var(--accent-hot);
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: rgba(232,237,245,0.75);
      animation: killSlide 0.3s ease-out, killFade 0.5s 2s forwards;
    }
    @keyframes killSlide { from { transform: translateX(40px); opacity: 0; } }
    @keyframes killFade  { to { opacity: 0; transform: translateY(-10px); } }

    /* Weapon display */
    #weapon-info {
      position: absolute;
      bottom: 24px; right: 24px;
      padding: 10px 18px;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--hud-border);
      border-radius: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: rgba(232,237,245,0.5);
    }

    /* Minimap */
    #minimap-container {
      position: absolute;
      bottom: 24px; left: 24px;
      width: 140px; height: 140px;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      overflow: hidden;
    }

    /* Error message */
    #error-msg {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,0,0,0.2);
      border: 1px solid red;
      color: white;
      padding: 24px;
      border-radius: 12px;
      z-index: 200;
      display: none;
      font-family: monospace;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="error-msg"></div>

<!-- Start Screen -->
<div id="start-screen">
  <h1>KING BULLET</h1>
  <p>Enter the arena and eliminate every target. Test your aim and reflexes in this high-octane shooting range.</p>
  <div class="controls-hint">
    <span><b>W A S D</b> — Move</span>
    <span><b>Mouse</b> — Aim</span>
    <span><b>Click</b> — Shoot</span>
    <span><b>Space</b> — Jump</span>
    <span><b>R</b> — Reload</span>
    <span><b>Shift</b> — Sprint</span>
  </div>
  <button id="start-btn">ENTER ARENA</button>
</div>

<!-- HUD -->
<div id="hud">
  <div id="crosshair"><div class="crosshair-dot"></div></div>
  <div id="hitmarker">
    <svg viewBox="0 0 24 24" width="24" height="24">
      <line x1="3" y1="3" x2="8" y2="8" stroke="#ffd740" stroke-width="2.5"/>
      <line x1="16" y1="3" x2="21" y2="8" stroke="#ffd740" stroke-width="2.5"/>
      <line x1="3" y1="21" x2="8" y2="16" stroke="#ffd740" stroke-width="2.5"/>
      <line x1="16" y1="21" x2="21" y2="16" stroke="#ffd740" stroke-width="2.5"/>
    </svg>
  </div>

  <div id="top-bar">
    <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score-val">0</span></div>
    <div class="stat"><span class="stat-label">Targets</span><span class="stat-value" id="kills-val">0</span></div>
    <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timer-val">0:00</span></div>
  </div>

  <div id="bottom-bar">
    <div class="bottom-panel">
      <span id="health-label">100</span>
      <div id="health-bar-outer"><div id="health-bar-inner"></div></div>
    </div>
    <div class="bottom-panel" style="flex-direction: column; align-items: flex-start;">
      <div id="ammo-display">
        <span id="ammo-current">30</span><span id="ammo-sep">/</span><span id="ammo-reserve">90</span>
      </div>
      <span id="reload-hint">R to reload</span>
    </div>
  </div>

  <div id="kill-feed"></div>
  <div id="weapon-info">AR-15 TACTICAL</div>
  <div id="muzzle-flash"></div>
  <div id="minimap-container"><canvas id="minimap-canvas" width="140" height="140"></canvas></div>
</div>

<!-- Three.js -->
<script>
// Load Three.js dynamically with error handling
function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load: ' + url));
    document.head.appendChild(s);
  });
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

(async () => {
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
    console.log('Three.js loaded:', THREE.REVISION);
    startGame();
  } catch (e) {
    showError('Could not load Three.js from CDN. Please check your internet connection and try again. Error: ' + e.message);
  }
})();

function startGame() {
  'use strict';

  // ── Constants ──────────────────────────────────
  const ARENA_SIZE = 120;
  const PLAYER_HEIGHT = 1.7;
  const WALK_SPEED = 8;
  const SPRINT_SPEED = 14;
  const JUMP_FORCE = 7;
  const GRAVITY = -20;
  const MOUSE_SENS = 0.002;
  const MAX_AMMO = 30;
  const MAX_RESERVE = 90;
  const RELOAD_TIME = 1.8;
  const FIRE_RATE = 0.1;
  const NUM_STATIC_TARGETS = 12;
  const NUM_MOVING_TARGETS = 6;
  const TARGET_RESPAWN_TIME = 3;

  // ── State ──────────────────────────────────────
  let scene, camera, renderer;
  let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
  let isSprinting = false, canJump = true;
  let velocityY = 0;
  let isLocked = false;
  let ammo = MAX_AMMO, reserve = MAX_RESERVE;
  let isReloading = false, reloadTimer = 0;
  let fireCooldown = 0;
  let score = 0, kills = 0;
  let gameTime = 0;
  let targets = [];
  let particles = [];
  let clock = new THREE.Clock();
  let euler = new THREE.Euler(0, 0, 0, 'YXZ');
  let direction = new THREE.Vector3();
  let raycaster = new THREE.Raycaster();
  let playerPos = new THREE.Vector3(0, PLAYER_HEIGHT, 0);
  let minimapCtx;

  // Audio
  let audioCtx;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playShootSound() {
    const ctx = ensureAudio();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.exponentialRampToValueAtTime(100, t + 0.08);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.1);

    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(150, t);
    osc2.frequency.exponentialRampToValueAtTime(30, t + 0.15);
    gain2.gain.setValueAtTime(0.4, t);
    gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc2.connect(gain2).connect(ctx.destination);
    osc2.start(t); osc2.stop(t + 0.15);
  }

  function playHitSound() {
    const ctx = ensureAudio();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, t);
    osc.frequency.exponentialRampToValueAtTime(2400, t + 0.06);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.12);
  }

  // ── Init ───────────────────────────────────────
  function init() {
    console.log('Initializing game...');

    // Renderer — use the existing canvas
    const canvas = document.getElementById('game-canvas');
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 2.0;
    console.log('Renderer created');

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 60, 150);

    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.copy(playerPos);

    // ── Lights ──
    const hemiLight = new THREE.HemisphereLight(0x8899cc, 0x223344, 1.0);
    scene.add(hemiLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
    dirLight.position.set(40, 60, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.left = -80;
    dirLight.shadow.camera.right = 80;
    dirLight.shadow.camera.top = 80;
    dirLight.shadow.camera.bottom = -80;
    scene.add(dirLight);

    const pl1 = new THREE.PointLight(0x00e5ff, 2.0, 80);
    pl1.position.set(-30, 8, -30);
    scene.add(pl1);

    const pl2 = new THREE.PointLight(0xff3d5a, 2.0, 80);
    pl2.position.set(30, 8, 30);
    scene.add(pl2);

    const pl3 = new THREE.PointLight(0x7c4dff, 2.0, 70);
    pl3.position.set(0, 12, -40);
    scene.add(pl3);

    console.log('Lights added');

    buildArena();
    spawnTargets();
    setupControls();
    setupMinimap();

    window.addEventListener('resize', onResize);

    console.log('Starting animation loop');
    animate();
  }

  // ── Build Arena ────────────────────────────────
  function buildArena() {
    // ── Ground ──
    const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x333355, roughness: 0.7, metalness: 0.2 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid
    const gridHelper = new THREE.GridHelper(ARENA_SIZE, 60, 0x5566bb, 0x3a3a66);
    gridHelper.position.y = 0.02;
    scene.add(gridHelper);

    // ── Walls ──
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4a7e, roughness: 0.5, metalness: 0.3 });
    const wallH = 8;
    const half = ARENA_SIZE / 2;

    [
      [ARENA_SIZE, wallH, 0.5, 0, wallH/2, -half],
      [ARENA_SIZE, wallH, 0.5, 0, wallH/2,  half],
      [0.5, wallH, ARENA_SIZE, -half, wallH/2, 0],
      [0.5, wallH, ARENA_SIZE,  half, wallH/2, 0],
    ].forEach(([w, h, d, x, y, z]) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      scene.add(mesh);
    });

    // ── Obstacles / cover ──
    const obMat = new THREE.MeshStandardMaterial({ color: 0x3355aa, roughness: 0.4, metalness: 0.5 });
    const obMat2 = new THREE.MeshStandardMaterial({ color: 0x445588, roughness: 0.4, metalness: 0.4 });
    [
      [-20, -15, 4, 3, 4],
      [ 15, -25, 6, 2.5, 2],
      [-10,  20, 3, 4, 3],
      [ 25,  10, 5, 3.5, 5],
      [-30,   5, 2, 5, 8],
      [ 10,  30, 8, 2, 2],
      [-25, -35, 4, 6, 4],
      [ 35, -20, 3, 4, 6],
    ].forEach(([x, z, w, h, d], i) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), i % 2 === 0 ? obMat : obMat2);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    });

    // ── Glowing strips on ground ──
    const stripMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.3 });
    for (let i = -4; i <= 4; i += 2) {
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_SIZE, 0.2), stripMat);
      strip.rotation.x = -Math.PI / 2;
      strip.position.set(0, 0.03, i * 12);
      scene.add(strip);
    }

    // ── Floating dust particles ──
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(500 * 3);
    for (let i = 0; i < 500; i++) {
      dustPos[i*3]   = (Math.random() - 0.5) * ARENA_SIZE;
      dustPos[i*3+1] = Math.random() * 10;
      dustPos[i*3+2] = (Math.random() - 0.5) * ARENA_SIZE;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x8899dd, size: 0.12, transparent: true, opacity: 0.5 }));
    scene.add(dust);

    console.log('Arena built');
  }

  // ── Targets ────────────────────────────────────
  function createTarget(pos, isMoving) {
    const group = new THREE.Group();

    // Back plate
    const plate = new THREE.Mesh(
      new THREE.CircleGeometry(0.85, 32),
      new THREE.MeshStandardMaterial({ color: 0x222244, side: THREE.DoubleSide })
    );
    plate.position.z = -0.03;
    group.add(plate);

    // Outer ring
    const outer = new THREE.Mesh(
      new THREE.RingGeometry(0.6, 0.85, 32),
      new THREE.MeshStandardMaterial({ color: 0xff3d5a, emissive: 0xff2222, emissiveIntensity: 0.5, side: THREE.DoubleSide })
    );
    group.add(outer);

    // Middle ring
    const mid = new THREE.Mesh(
      new THREE.RingGeometry(0.3, 0.55, 32),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.2, side: THREE.DoubleSide })
    );
    group.add(mid);

    // Bullseye
    const bull = new THREE.Mesh(
      new THREE.CircleGeometry(0.2, 24),
      new THREE.MeshStandardMaterial({ color: 0xff3d5a, emissive: 0xff3d5a, emissiveIntensity: 0.8, side: THREE.DoubleSide })
    );
    group.add(bull);

    // Stand
    const stand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, pos.y, 8),
      new THREE.MeshStandardMaterial({ color: 0x555577 })
    );
    stand.position.y = -pos.y / 2;
    group.add(stand);

    group.position.copy(pos);

    group.userData = {
      isTarget: true,
      isMoving: isMoving,
      alive: true,
      health: 100,
      basePos: pos.clone(),
      movePhase: Math.random() * Math.PI * 2,
      moveAxis: Math.random() > 0.5 ? 'x' : 'z',
      moveRange: 8 + Math.random() * 10,
      moveSpeed: 1 + Math.random() * 2,
      respawnTimer: 0,
      points: isMoving ? 150 : 100,
    };

    scene.add(group);
    targets.push(group);
  }

  function spawnTargets() {
    for (let i = 0; i < NUM_STATIC_TARGETS; i++) {
      createTarget(new THREE.Vector3(
        (Math.random() - 0.5) * ARENA_SIZE * 0.8,
        1.5 + Math.random() * 2.5,
        (Math.random() - 0.5) * ARENA_SIZE * 0.8
      ), false);
    }
    for (let i = 0; i < NUM_MOVING_TARGETS; i++) {
      createTarget(new THREE.Vector3(
        (Math.random() - 0.5) * ARENA_SIZE * 0.6,
        2 + Math.random() * 2,
        (Math.random() - 0.5) * ARENA_SIZE * 0.6
      ), true);
    }
    console.log('Targets spawned:', targets.length);
  }

  // ── Controls ───────────────────────────────────
  function setupControls() {
    document.addEventListener('keydown', e => {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Space':
          if (canJump) { velocityY = JUMP_FORCE; canJump = false; }
          e.preventDefault();
          break;
        case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
        case 'KeyR': startReload(); break;
      }
    });
    document.addEventListener('keyup', e => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
        case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
      }
    });
    document.addEventListener('mousemove', e => {
      if (!isLocked) return;
      euler.setFromQuaternion(camera.quaternion);
      euler.y -= e.movementX * MOUSE_SENS;
      euler.x -= e.movementY * MOUSE_SENS;
      euler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, euler.x));
      camera.quaternion.setFromEuler(euler);
    });
    document.addEventListener('mousedown', e => {
      if (!isLocked) return;
      if (e.button === 0) shoot();
    });
    document.addEventListener('pointerlockchange', () => {
      isLocked = !!document.pointerLockElement;
      console.log('Pointer lock:', isLocked);
      if (!isLocked) {
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('hud').classList.remove('visible');
      }
    });
  }

  // ── Shooting ───────────────────────────────────
  function shoot() {
    if (fireCooldown > 0 || isReloading || ammo <= 0) return;
    ammo--;
    fireCooldown = FIRE_RATE;
    updateAmmoDisplay();
    playShootSound();

    // Muzzle flash
    const mf = document.getElementById('muzzle-flash');
    mf.classList.remove('flash');
    void mf.offsetWidth;
    mf.classList.add('flash');

    // Recoil
    euler.setFromQuaternion(camera.quaternion);
    euler.x += 0.012;
    camera.quaternion.setFromEuler(euler);

    // Raycast
    raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
    const hits = raycaster.intersectObjects(scene.children, true);

    for (const hit of hits) {
      let tg = hit.object;
      while (tg && !tg.userData.isTarget) tg = tg.parent;
      if (tg && tg.userData.isTarget && tg.userData.alive) {
        targetHit(tg, hit.point);
        break;
      }
      if (!tg || !tg.userData.isTarget) {
        spawnImpact(hit.point, 0x5577cc, 6);
        break;
      }
    }

    if (ammo <= 0 && reserve > 0) setTimeout(startReload, 300);
  }

  function targetHit(tg, pt) {
    tg.userData.health -= 50;
    playHitSound();

    // Hitmarker
    const hm = document.getElementById('hitmarker');
    hm.classList.add('flash');
    setTimeout(() => hm.classList.remove('flash'), 120);

    spawnImpact(pt, 0xff3d5a, 12);

    if (tg.userData.health <= 0) {
      tg.userData.alive = false;
      score += tg.userData.points;
      kills++;
      updateHUD();
      addKillEntry(tg.userData.isMoving ? 'Moving Target' : 'Static Target', tg.userData.points);

      // Destroy animation
      let p = 0;
      function des() {
        p += 0.05;
        tg.scale.setScalar(Math.max(0, 1 - p));
        if (p < 1) { requestAnimationFrame(des); }
        else {
          tg.visible = false;
          tg.userData.respawnTimer = TARGET_RESPAWN_TIME;
        }
      }
      des();
    }
  }

  function spawnImpact(position, color, count) {
    for (let i = 0; i < count; i++) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 4, 4),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
      );
      mesh.position.copy(position);
      scene.add(mesh);
      particles.push({
        mesh,
        vel: new THREE.Vector3((Math.random()-0.5)*6, Math.random()*4, (Math.random()-0.5)*6),
        life: 1
      });
    }
  }

  // ── Reload ─────────────────────────────────────
  function startReload() {
    if (isReloading || ammo === MAX_AMMO || reserve <= 0) return;
    isReloading = true;
    reloadTimer = RELOAD_TIME;
    document.getElementById('ammo-display').classList.add('reloading');
  }
  function finishReload() {
    const needed = MAX_AMMO - ammo;
    const toLoad = Math.min(needed, reserve);
    ammo += toLoad;
    reserve -= toLoad;
    isReloading = false;
    document.getElementById('ammo-display').classList.remove('reloading');
    updateAmmoDisplay();
  }

  // ── HUD ────────────────────────────────────────
  function updateHUD() {
    document.getElementById('score-val').textContent = score;
    document.getElementById('kills-val').textContent = kills;
  }
  function updateAmmoDisplay() {
    document.getElementById('ammo-current').textContent = ammo;
    document.getElementById('ammo-reserve').textContent = reserve;
  }
  function updateTimer() {
    const m = Math.floor(gameTime / 60);
    const s = Math.floor(gameTime % 60);
    document.getElementById('timer-val').textContent = m + ':' + String(s).padStart(2, '0');
  }
  function addKillEntry(name, pts) {
    const el = document.createElement('div');
    el.className = 'kill-entry';
    el.textContent = '✕ ' + name + ' +' + pts;
    document.getElementById('kill-feed').appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  // ── Minimap ────────────────────────────────────
  function setupMinimap() {
    minimapCtx = document.getElementById('minimap-canvas').getContext('2d');
  }
  function drawMinimap() {
    const ctx = minimapCtx;
    const sz = 140;
    const scale = sz / ARENA_SIZE;
    ctx.clearRect(0, 0, sz, sz);
    ctx.fillStyle = 'rgba(10,10,18,0.7)';
    ctx.fillRect(0, 0, sz, sz);

    targets.forEach(t => {
      if (!t.userData.alive) return;
      ctx.fillStyle = t.userData.isMoving ? '#ffd740' : '#ff3d5a';
      ctx.beginPath();
      ctx.arc((t.position.x + ARENA_SIZE/2) * scale, (t.position.z + ARENA_SIZE/2) * scale, 2.5, 0, Math.PI*2);
      ctx.fill();
    });

    const px = (playerPos.x + ARENA_SIZE/2) * scale;
    const py = (playerPos.z + ARENA_SIZE/2) * scale;
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.arc(px, py, 3.5, 0, Math.PI*2);
    ctx.fill();

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + dir.x * 12, py + dir.z * 12);
    ctx.stroke();
  }

  // ── Game Loop ──────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);

    if (!isLocked) {
      renderer.render(scene, camera);
      return;
    }

    gameTime += delta;
    updateTimer();

    // Movement
    const speed = isSprinting ? SPRINT_SPEED : WALK_SPEED;
    direction.set(0, 0, 0);
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();

    if (moveForward)  direction.add(fwd);
    if (moveBackward) direction.sub(fwd);
    if (moveRight)    direction.add(right);
    if (moveLeft)     direction.sub(right);
    if (direction.lengthSq() > 0) direction.normalize();

    playerPos.x += direction.x * speed * delta;
    playerPos.z += direction.z * speed * delta;

    // Gravity
    velocityY += GRAVITY * delta;
    playerPos.y += velocityY * delta;
    if (playerPos.y <= PLAYER_HEIGHT) {
      playerPos.y = PLAYER_HEIGHT;
      velocityY = 0;
      canJump = true;
    }

    // Bounds
    const half = ARENA_SIZE / 2 - 0.5;
    playerPos.x = Math.max(-half, Math.min(half, playerPos.x));
    playerPos.z = Math.max(-half, Math.min(half, playerPos.z));

    camera.position.copy(playerPos);

    // Fire cooldown
    if (fireCooldown > 0) fireCooldown -= delta;

    // Reload
    if (isReloading) {
      reloadTimer -= delta;
      if (reloadTimer <= 0) finishReload();
    }

    // Update targets
    targets.forEach(t => {
      if (!t.userData.alive) {
        if (t.userData.respawnTimer > 0) {
          t.userData.respawnTimer -= delta;
          if (t.userData.respawnTimer <= 0) {
            t.userData.alive = true;
            t.userData.health = 100;
            t.visible = true;
            t.scale.set(1, 1, 1);
            t.position.x = (Math.random() - 0.5) * ARENA_SIZE * 0.8;
            t.position.z = (Math.random() - 0.5) * ARENA_SIZE * 0.8;
            t.userData.basePos.copy(t.position);
          }
        }
        return;
      }

      // Face player
      t.lookAt(camera.position.x, t.position.y, camera.position.z);

      // Moving targets
      if (t.userData.isMoving) {
        t.userData.movePhase += delta * t.userData.moveSpeed;
        const off = Math.sin(t.userData.movePhase) * t.userData.moveRange;
        if (t.userData.moveAxis === 'x') t.position.x = t.userData.basePos.x + off;
        else t.position.z = t.userData.basePos.z + off;
        const b = ARENA_SIZE / 2 - 2;
        t.position.x = Math.max(-b, Math.min(b, t.position.x));
        t.position.z = Math.max(-b, Math.min(b, t.position.z));
      }
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= delta * 2;
      p.mesh.position.add(p.vel.clone().multiplyScalar(delta));
      p.vel.y += GRAVITY * 0.5 * delta;
      p.mesh.material.opacity = Math.max(0, p.life);
      if (p.life <= 0) {
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
        particles.splice(i, 1);
      }
    }

    // Head bob
    if (direction.lengthSq() > 0 && canJump) {
      const bs = isSprinting ? 14 : 10;
      camera.position.y += Math.sin(gameTime * bs) * (isSprinting ? 0.06 : 0.03);
    }

    drawMinimap();
    renderer.render(scene, camera);
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // ── Start button ───────────────────────────────
  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.add('visible');
    document.getElementById('game-canvas').requestPointerLock();
  });

  init();
}
</script>

<!-- The canvas MUST exist before the script tries to grab it -->
<canvas id="game-canvas"></canvas>
